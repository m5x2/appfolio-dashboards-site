<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m5x2 Property Health</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2f2f7; color: #1c1c1e; }

/* ── Topbar ── */
.topbar { background: #1c1c1e; color: #fff; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.topbar-meta  { font-size: 12px; color: #636366; }

/* ── Summary bar ── */
.summary-bar { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 12px 28px; display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.sum-item .sum-label { font-size: 10px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; }
.sum-item .sum-value { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
.sum-divider { width: 1px; height: 34px; background: #e5e5ea; }
.tier-group { display: flex; gap: 20px; }
.tier-item { display: flex; align-items: center; gap: 7px; }
.tier-dot  { width: 8px; height: 8px; border-radius: 50%; }
.tier-info .tier-count { font-size: 17px; font-weight: 700; line-height: 1.1; }
.tier-info .tier-name  { font-size: 10px; color: #8e8e93; }

/* ── Info bar ── */
.info-bar { background: #f9f9fb; border-bottom: 1px solid #e5e5ea; padding: 8px 28px; font-size: 11px; color: #8e8e93; display: flex; gap: 20px; flex-wrap: wrap; }
.info-bar span { display: flex; align-items: center; gap: 4px; }

/* ── Table wrapper ── */
.table-wrap { padding: 16px 20px 40px; overflow-x: auto; }

table { width: 100%; border-collapse: separate; border-spacing: 0 4px; min-width: 960px; }

/* ── Header ── */
thead th { background: #fff; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #8e8e93; padding: 8px 12px; text-align: left; cursor: pointer; white-space: nowrap; user-select: none; border-bottom: 2px solid #e5e5ea; }
thead th.sorted-asc::after  { content: ' \2191'; color: #007aff; }
thead th.sorted-desc::after { content: ' \2193'; color: #007aff; }
thead th:hover { color: #1c1c1e; }
thead th.num-col { text-align: right; }

/* ── Rows ── */
tbody tr { background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: box-shadow 0.12s; }
tbody tr:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.10); }
tbody td { padding: 10px 12px; font-size: 13px; vertical-align: middle; border-top: 1px solid #f2f2f7; border-bottom: 1px solid #f2f2f7; }
tbody td:first-child { border-left: 1px solid #f2f2f7; border-radius: 8px 0 0 8px; }
tbody td:last-child  { border-right: 1px solid #f2f2f7; border-radius: 0 8px 8px 0; }
tbody td.num-col { text-align: right; }

/* ── Score badge ── */
.score-badge { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; font-size: 14px; font-weight: 800; }
.badge-green  { background: #d4f5e2; color: #1a7a36; }
.badge-yellow { background: #fff3cd; color: #8a5c00; }
.badge-red    { background: #ffe5e3; color: #c0392b; }

/* ── Property name cell ── */
.prop-name { font-weight: 700; font-size: 14px; letter-spacing: -0.2px; }
.prop-sub  { font-size: 11px; color: #8e8e93; margin-top: 1px; }
.prop-flag { display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; background: #f2f2f7; color: #8e8e93; margin-left: 5px; vertical-align: middle; }

/* ── Metric pill ── */
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.pill-green  { background: #d4f5e2; color: #1a7a36; }
.pill-yellow { background: #fff3cd; color: #8a5c00; }
.pill-red    { background: #ffe5e3; color: #c0392b; }
.pill-gray   { background: #f2f2f7; color: #8e8e93; }

/* ── Sub-value ── */
.sub-val { font-size: 10px; color: #8e8e93; margin-top: 2px; }

/* ── WO cell ── */
.wo-count { font-size: 14px; font-weight: 700; }

/* ── Colors ── */
.c-green  { color: #34c759; }
.c-yellow { color: #ff9f0a; }
.c-red    { color: #ff3b30; }
.c-gray   { color: #8e8e93; }
</style>

function pct(v, dec) { dec = dec || 0; return (v * 100).toFixed(dec) + '%'; }
function fmt$(v) {
  if (v < 1000) return '$' + Math.round(v);
  return '$' + (v / 1000).toFixed(1) + 'k';
}

function tierColor(score) {
  return score >= 70 ? 'green' : score >= 50 ? 'yellow' : 'red';
}

function vacColor(v)   { return v < 0.03 ? 'green' : v < 0.08 ? 'yellow' : 'red'; }
function delqColor(v)  { return v < 0.02 ? 'green' : v < 0.05 ? 'yellow' : 'red'; }

// ── Sort ──────────────────────────────────────────────────────────────────────

function sortBy(col) {
  if (currentSort.col === col) {
    currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort.col = col;
    currentSort.dir = 'asc';
  }

  var dir = currentSort.dir === 'asc' ? 1 : -1;
  rows.sort(function(a, b) {
    var av = a[col], bv = b[col];
    if (col === 'rank') { av = a.score; bv = b.score; }
    if (av === null) av = -1;
    if (bv === null) bv = -1;
    if (typeof av === 'string') return dir * av.localeCompare(bv);
    return dir * (av - bv);
  });

  document.querySelectorAll('thead th[data-col]').forEach(function(th) {
    th.classList.remove('sorted-asc', 'sorted-desc');
  });
  var th = document.querySelector('thead th[data-col="' + col + '"]');
  if (th) th.classList.add(currentSort.dir === 'asc' ? 'sorted-asc' : 'sorted-desc');

  renderRows();
}

document.querySelectorAll('thead th[data-col]').forEach(function(th) {
  th.addEventListener('click', function() { sortBy(th.dataset.col); });
});

renderRows();
document.querySelector('thead th[data-col="score"]').classList.add('sorted-asc');
