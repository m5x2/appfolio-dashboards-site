tbody td:last-child  { border-right: 1px solid #f2f2f7; border-radius: 0 8px 8px 0; }

}

// ── Retention bar ─────────────────────────────────────────────────────────────

var RET_COLORS = { mtm: '#8e8e93', mgmt: '#818cf8', high: '#ff3b30', medium: '#ff9f0a', low: '#34c759' };
var RET_LABELS = { mtm: 'MTM', mgmt: 'Mgmt removal', high: 'High risk', medium: 'Medium risk', low: 'Locked in' };

function retBar(p) {
  var r = p.retention;
  if (!r) return '<span style="color:#c7c7cc;font-size:11px">\u2014</span>';

  var inPipeline = (r.mtm || 0) + (r.mgmt || 0) + (r.high || 0) + (r.medium || 0) + (r.low || 0);
  if (!inPipeline) return '<span style="color:#c7c7cc;font-size:11px">\u2014</span>';

  var totalUnits = p.units || inPipeline;
  var retUrl = 'retention.html?property=' + encodeURIComponent(p.name);
  var expVac = Math.round(r.expected_vac || 0);

  // Each segment width = count / totalUnits (bar represents whole property)
  var segs = [
    { key: 'mtm',    n: r.mtm    || 0 },
    { key: 'mgmt',   n: r.mgmt   || 0 },
    { key: 'high',   n: r.high   || 0 },
    { key: 'medium', n: r.medium || 0 },
    { key: 'low',    n: r.low    || 0 },
  ].filter(function(s) { return s.n > 0; }).map(function(s) {
    var w = (s.n / totalUnits * 100).toFixed(1);
    return '<div class="ret-bar-seg" style="width:' + w + '%;background:' + RET_COLORS[s.key] + '" title="' + RET_LABELS[s.key] + ': ' + s.n + '"></div>';
  }).join('');

  var label = inPipeline + ' of ' + totalUnits + ' units' + (expVac > 0 ? ' \u00b7 ~' + expVac + ' likely vac' : '');

  return '<a href="' + retUrl + '" style="text-decoration:none">'
    + '<div class="ret-wrap">'
      + '<div class="ret-bar">' + segs + '</div>'
      + '<div class="ret-label">' + label + '</div>'
    + '</div>'
  + '</a>';
}

function tierColor(score) {
  return score >= 70 ? 'green' : score >= 50 ? 'yellow' : 'red';
}

function vacColor(v)   { return v < 0.03 ? 'green' : v < 0.08 ? 'yellow' : 'red'; }
function delqColor(v)  { return v < 0.02 ? 'green' : v < 0.05 ? 'yellow' : 'red'; }


// ── Render summary ────────────────────────────────────────────────────────────

var s = DATA.summary;
var avgColor = tierColor(s.avg_score);
var avgHex = avgColor === 'green' ? '#34c759' : avgColor === 'yellow' ? '#ff9f0a' : '#ff3b30';

document.getElementById('topMeta').textContent = DATA.as_of + ' \u00b7 AppFolio live data';

document.getElementById('summaryBar').innerHTML =
  '<div class="sum-item">'
    + '<div class="sum-label">Portfolio Score</div>'
    + '<div class="sum-value" style="color:' + avgHex + '">' + s.avg_score + '</div>'
  + '</div>'
  + '<div class="sum-divider"></div>'
  + '<div class="sum-item">'
    + '<div class="sum-label">Properties</div>'
    + '<div class="sum-value">' + s.count + '</div>'
  + '</div>'
  + '<div class="sum-item">'
    + '<div class="sum-label">Total Units</div>'
    + '<div class="sum-value">' + s.total_units.toLocaleString() + '</div>'
  + '</div>'
  + '<div class="sum-divider"></div>'
  + '<div class="tier-group">'
    + '<div class="tier-item"><div class="tier-dot" style="background:#34c759"></div>'
      + '<div class="tier-info"><div class="tier-count c-green">' + s.greens + '</div><div class="tier-name">Healthy (70+)</div></div></div>'
    + '<div class="tier-item"><div class="tier-dot" style="background:#ff9f0a"></div>'
      + '<div class="tier-info"><div class="tier-count c-yellow">' + s.yellows + '</div><div class="tier-name">At Risk (50\u201369)</div></div></div>'
    + '<div class="tier-item"><div class="tier-dot" style="background:#ff3b30"></div>'
      + '<div class="tier-info"><div class="tier-count c-red">' + s.reds + '</div><div class="tier-name">Critical (&lt;50)</div></div></div>'
  + '</div>';

// ── Render table ──────────────────────────────────────────────────────────────

var currentSort = { col: 'score', dir: 'asc' };
var rows = DATA.properties.slice();

function renderRows() {
  var tbody = document.getElementById('tableBody');
  tbody.innerHTML = rows.map(function(p, i) {
    var tc = tierColor(p.score);
    var singleUnit = p.units === 1;
    var vacStr = p.vacant + ' of ' + p.units + ' units';
    var delqStr = p.delinq_balance > 0 ? fmt$(p.delinq_balance) : '\u2014';
    var dqUrl = 'dq-case-type.html?property=' + encodeURIComponent(p.name);

    return '<tr>'
      + '<td class="num-col" style="color:#8e8e93;font-size:12px;font-weight:600">' + (i + 1) + '</td>'
      + '<td>'
        + '<div class="prop-name"><a href="https://mckay.appfolio.com/properties/' + p.id + '" target="_blank" style="color:inherit;text-decoration:none;" onmouseover="this.style.textDecoration=\'underline\'" onmouseout="this.style.textDecoration=\'none\'">' + p.name + '</a>' + (p.focus ? '<span class="prop-focus">FOCUS</span>' : '') + (singleUnit ? '<span class="prop-flag">1 unit</span>' : '') + '</div>'
        + '<div class="prop-sub">' + p.units + ' units &nbsp;&middot;&nbsp; ' + p.occupied + ' occupied</div>'
      + '</td>'
      + '<td class="num-col"><div class="score-badge badge-' + tc + '">' + p.score + '</div></td>'
      + '<td class="num-col">'
        + '<span class="pill pill-' + vacColor(p.vacancy_pct_gpr) + '">' + pct(p.vacancy_pct_gpr, 1) + '</span>'
        + '<div class="sub-val">' + vacStr + '</div>'
      + '</td>'
      + '<td>' + retBar(p) + '</td>'
      + '<td class="num-col">'
        + '<a href="' + dqUrl + '" style="text-decoration:none">'
          + '<span class="pill pill-' + delqColor(p.delinquency_rate) + '">' + pct(p.delinquency_rate, 1) + '</span>'
        + '</a>'
        + '<div class="sub-val">' + delqStr + '</div>'
      + '</td>'
      + '</tr>';
  }).join('');
}

// ── Sort ──────────────────────────────────────────────────────────────────────

function sortBy(col) {
  if (currentSort.col === col) {
    currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort.col = col;
    currentSort.dir = 'asc';
  }

  var dir = currentSort.dir === 'asc' ? 1 : -1;
  rows.sort(function(a, b) {
    var av = a[col], bv = b[col];
    if (col === 'rank') { av = a.score; bv = b.score; }
    if (av === null) av = -1;
    if (bv === null) bv = -1;
    if (typeof av === 'string') return dir * av.localeCompare(bv);
    return dir * (av - bv);
  });

  document.querySelectorAll('thead th[data-col]').forEach(function(th) {
    th.classList.remove('sorted-asc', 'sorted-desc');
  });
  var th = document.querySelector('thead th[data-col="' + col + '"]');
  if (th) th.classList.add(currentSort.dir === 'asc' ? 'sorted-asc' : 'sorted-desc');

  renderRows();
}

document.querySelectorAll('thead th[data-col]').forEach(function(th) {
  th.addEventListener('click', function() { sortBy(th.dataset.col); });
});

renderRows();
document.querySelector('thead th[data-col="score"]').classList.add('sorted-asc');
</script>
</body>
</html>
